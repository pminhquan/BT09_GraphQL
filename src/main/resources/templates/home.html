<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - BT09 GraphQL</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <h1>Product Catalog (GraphQL)</h1>
        <nav>
            <a th:href="@{/}">Home</a>
            <a th:href="@{/products}">Products</a>
            <a th:href="@{/categories}">Categories</a>
        </nav>
    </header>

    <div class="container">
        <h2>Products List</h2>
        <div id="alertBox" class="alert"></div>

        <div class="filter-bar">
            <label for="categoryFilter">Filter by Category:</label>
            <select id="categoryFilter">
                <option value="">All Categories (Price Ascending)</option>
            </select>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Category</th>
                    <th>User</th>
                    <th>Description</th>
                </tr>
            </thead>
            <tbody id="productTableBody">
                <tr>
                    <td colspan="7">Loading products...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script th:src="@{/js/graphql.js}"></script>
    <script th:src="@{/js/home.js}"></script>
</body>
</html>
