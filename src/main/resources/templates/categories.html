<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Management - BT09 GraphQL</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <h1>Category Management (GraphQL CRUD)</h1>
        <nav>
            <a th:href="@{/}">Home</a>
            <a th:href="@{/products}">Products</a>
            <a th:href="@{/categories}">Categories</a>
        </nav>
    </header>

    <div class="container">
        <h2 id="formTitle">Add New Category</h2>
        <div id="alertBox" class="alert"></div>

        <form id="categoryForm" style="margin-bottom: 30px;">
            <input type="hidden" id="categoryId">

            <div class="form-group">
                <label for="name">Category Name *</label>
                <input type="text" id="name" required>
            </div>

            <div class="form-group">
                <label for="images">Images URL</label>
                <input type="text" id="images">
            </div>

            <div>
                <button type="submit" id="submitBtn" class="btn btn-primary">Create Category</button>
                <button type="button" id="cancelBtn" class="btn btn-secondary" style="display: none;">Cancel</button>
            </div>
        </form>

        <h2>Category List</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Images</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="categoryTableBody">
                <tr>
                    <td colspan="4">Loading categories...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script th:src="@{/js/graphql.js}"></script>
    <script th:src="@{/js/categories.js}"></script>
</body>
</html>
